# docker-compose.it.yml
#
# EVM side of the evm-asset-bridge Docker-based integration-test (IT) stack:
# a local anvil chain plus a one-shot deployer that builds and runs
# script/DeployIT.s.sol against it. Bring up with `make it-up`, tear down
# with `make it-down` (removes volumes/orphans; anvil is stateless anyway).
#
# This stack is the piece the DAML (Canton) and dlc-attestor components test
# against: attestor keys and the fixed contract addresses this deployment
# produces live in it/attestor-keys.env and script/DeployIT.s.sol.

services:
  anvil:
    build:
      context: .
      dockerfile: Dockerfile.anvil
    container_name: evm-asset-bridge-anvil
    ports:
      - "8545:8545"
    healthcheck:
      # `cast` ships in the same foundry base image as anvil, so this runs
      # entirely inside the container against its own RPC port.
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  deployer:
    build:
      context: .
      dockerfile: Dockerfile.deployer
    container_name: evm-asset-bridge-deployer
    depends_on:
      anvil:
        condition: service_healthy
    # One-shot: builds + runs script/DeployIT.s.sol against anvil, then exits.
    restart: "no"

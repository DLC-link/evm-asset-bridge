# Builds and publishes the evm-asset-bridge image (see infra/docker/README.md).
#
# A pull request builds the image, runs the smoke gate and scans the
# image. It publishes nothing. It needs no AWS credentials. It therefore
# never requests an identity token.
#
# A push to main publishes. A manual dispatch publishes only when it
# runs on main. A push to main also moves `latest`.
#
# Publishing uses gh-oidc-publish-evm-asset-bridge. This role allows
# public-ECR access to this repository and trusts only main. A failed
# role assumption can mean the role is missing or the workflow's OIDC
# subject is not trusted.
#
# Trivy scans the amd64 image that the build job loads locally. A pull
# request therefore gets its scan before anything reaches the registry.
# The scan only reports. It writes the result to the job summary on
# every run, and to a sticky comment on a pull request.
name: Build and push evm-asset-bridge

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions: {}

jobs:
  # This job runs on every event, and it needs no AWS credentials. It is
  # the hard gate: a broken image fails here before any publish starts.
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    # pull-requests: write lets the scan post its comment. Only someone
    # who can push a branch to this private repository can open a pull
    # request here, so this token gives PR code no new access.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Extract git SHA
        id: git-sha
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # This job builds amd64 only, so it needs no QEMU. The publish job
      # builds arm64 as well, and it sets QEMU up for that.
      - name: Build amd64 image for the smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./infra/docker/Dockerfile
          load: true
          tags: evm-asset-bridge-smoke:${{ steps.git-sha.outputs.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Smoke test the image
        run: bash infra/docker/smoke-eth.sh evm-asset-bridge-smoke:${{ steps.git-sha.outputs.sha }}

      # exit-code 0 keeps the scan report-only. A finding never fails the
      # build.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: evm-asset-bridge-smoke:${{ steps.git-sha.outputs.sha }}
          format: json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          output: trivy-report.json

      - name: Write the scan report
        env:
          IMAGE: evm-asset-bridge-smoke:${{ steps.git-sha.outputs.sha }}
        run: |
          crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-report.json)
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-report.json)
          fixable=$(jq '[.Results[]?.Vulnerabilities[]? | select(.FixedVersion != null and .FixedVersion != "")] | length' trivy-report.json)
          total=$((crit + high))

          if [ "$total" -eq 0 ]; then
            status="🟢 **Clean**: no HIGH or CRITICAL findings"
          elif [ "$fixable" -gt 0 ]; then
            status="🔴 **${fixable} fixable** of ${total} HIGH/CRITICAL findings"
          else
            status="🟡 ${total} HIGH/CRITICAL findings, none fixable upstream yet"
          fi

          {
            echo "## Trivy vulnerability scan"
            echo ""
            echo "${status}"
            echo ""
            echo "| Image | CRITICAL | HIGH |"
            echo "|---|---:|---:|"
            echo "| \`${IMAGE}\` (linux/amd64) | ${crit} | ${high} |"
            echo ""

            if [ "$total" -gt 0 ]; then
              echo "| Package | CVE | Severity | Installed | Fixed in |"
              echo "|---|---|---|---|---|"
              jq -r '
                .Results[]?.Vulnerabilities[]?
                | [
                    "`" + .PkgName + "`",
                    "[" + .VulnerabilityID + "](" + (.PrimaryURL // ("https://avd.aquasec.com/nvd/" + (.VulnerabilityID | ascii_downcase))) + ")",
                    (if .Severity == "CRITICAL" then "🔴 CRITICAL" else "🟠 HIGH" end),
                    "`" + .InstalledVersion + "`",
                    (if (.FixedVersion // "") == "" then "_unfixed_" else "`" + .FixedVersion + "`" end)
                  ]
                | "| " + join(" | ") + " |"
              ' trivy-report.json
              echo ""
              echo "<sub>A row marked \`_unfixed_\` has no upstream patch yet. A rebuild cannot fix it.</sub>"
            fi
          } > trivy-report.md

          cat trivy-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the scan report to the pull request
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: trivy-scan
          path: trivy-report.md

  # This job holds the publish credential, so it runs only for the ref
  # that carries reviewed code. The condition keys on the ref, not the
  # event: a pull request never reaches it, and neither does a push or a
  # manual dispatch on any branch other than main. Publishing an image
  # built from unmerged code would put untested tags in a public
  # registry, and would hand the publish role to that code.
  publish:
    name: Publish to public ECR
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Extract git SHA
        id: git-sha
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Use the dedicated public publishing role, whose trust is pinned to main.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::903295530547:role/gh-oidc-publish-evm-asset-bridge
          aws-region: us-east-1
          role-session-name: gha-${{ github.run_id }}

      # Public ECR authenticates only in us-east-1.
      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          registry-type: public
          mask-password: true

      # `main` also moves `latest`. The condition keys on the ref, not
      # the event. A manual run on main therefore behaves like a push.
      - name: Resolve image tags
        id: tags
        env:
          SHA: ${{ steps.git-sha.outputs.sha }}
          REF: ${{ github.ref }}
        run: |
          {
            echo "tags<<EOF"
            echo "public.ecr.aws/dlc-link/evm-asset-bridge:beth-$SHA"
            if [ "$REF" = "refs/heads/main" ]; then
              echo "public.ecr.aws/dlc-link/evm-asset-bridge:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The amd64 layers come from the build job's cache. provenance and
      # sbom must stay false. Public ECR rejects the buildx attestation
      # manifests.
      - name: Build and push the multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./infra/docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # Canton's workflow does not print the tag. A consumer must then
      # read the tag out of the build log. This step prints it instead.
      - name: Report the pushed tags
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "### evm-asset-bridge pushed"
            echo
            echo "Consumers pin one of these:"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
